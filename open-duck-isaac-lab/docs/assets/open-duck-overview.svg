<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open Duck Isaac Lab overview</title>
  <desc id="desc">A high-level project flow from robot assets to Isaac Lab environments, training, evaluation, and deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.52" stop-color="#0f1f2e"/>
      <stop offset="1" stop-color="#172735"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132437"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d3e5"/>
      <stop offset="1" stop-color="#f0b43c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6ee7f2"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="110" cy="86" r="120" fill="#34d3e5" opacity="0.08"/>
  <circle cx="1080" cy="440" r="150" fill="#f0b43c" opacity="0.08"/>

  <text x="600" y="72" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#f7fbff">Open Duck Isaac Lab</text>
  <text x="600" y="108" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#a9bdd0">Robot asset pipeline, Isaac Lab RL tasks, and policy playback for Open Duck Mini</text>

  <g filter="url(#shadow)">
    <rect x="80" y="170" width="190" height="170" rx="22" fill="url(#card)" stroke="#26445c"/>
    <rect x="303" y="170" width="190" height="170" rx="22" fill="url(#card)" stroke="#26445c"/>
    <rect x="526" y="170" width="190" height="170" rx="22" fill="url(#card)" stroke="#26445c"/>
    <rect x="749" y="170" width="190" height="170" rx="22" fill="url(#card)" stroke="#26445c"/>
    <rect x="972" y="170" width="148" height="170" rx="22" fill="url(#card)" stroke="#26445c"/>
  </g>

  <path d="M270 255 H300" stroke="#6ee7f2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M493 255 H523" stroke="#6ee7f2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M716 255 H746" stroke="#6ee7f2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M939 255 H969" stroke="#6ee7f2" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="175" y="218" text-anchor="middle" font-size="20" font-weight="800" fill="#f7fbff">Robot Assets</text>
    <text x="175" y="250" text-anchor="middle" font-size="14" fill="#b9c9d8">URDF + meshes</text>
    <text x="175" y="276" text-anchor="middle" font-size="14" fill="#b9c9d8">training USD export</text>
    <path d="M150 308 H200" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>

    <text x="398" y="218" text-anchor="middle" font-size="20" font-weight="800" fill="#f7fbff">Isaac Lab</text>
    <text x="398" y="250" text-anchor="middle" font-size="14" fill="#b9c9d8">direct RL environments</text>
    <text x="398" y="276" text-anchor="middle" font-size="14" fill="#b9c9d8">terrain + contacts</text>
    <path d="M373 308 H423" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>

    <text x="621" y="218" text-anchor="middle" font-size="20" font-weight="800" fill="#f7fbff">Training</text>
    <text x="621" y="250" text-anchor="middle" font-size="14" fill="#b9c9d8">RSL-RL PPO</text>
    <text x="621" y="276" text-anchor="middle" font-size="14" fill="#b9c9d8">domain randomization</text>
    <path d="M596 308 H646" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>

    <text x="844" y="218" text-anchor="middle" font-size="20" font-weight="800" fill="#f7fbff">Evaluation</text>
    <text x="844" y="250" text-anchor="middle" font-size="14" fill="#b9c9d8">checkpoint playback</text>
    <text x="844" y="276" text-anchor="middle" font-size="14" fill="#b9c9d8">rough terrain demos</text>
    <path d="M819 308 H869" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>

    <text x="1046" y="218" text-anchor="middle" font-size="20" font-weight="800" fill="#f7fbff">Deploy</text>
    <text x="1046" y="250" text-anchor="middle" font-size="14" fill="#b9c9d8">teleop</text>
    <text x="1046" y="276" text-anchor="middle" font-size="14" fill="#b9c9d8">TorchScript / ONNX</text>
    <path d="M1021 308 H1071" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <rect x="130" y="392" width="940" height="56" rx="18" fill="#0b1825" stroke="#223b50"/>
  <text x="600" y="427" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#d7e6f3">Main task: Isaac-Open-Duck-Direct-v0 | Imitation task: Isaac-Open-Duck-Imitation-Direct-v0</text>
</svg>
