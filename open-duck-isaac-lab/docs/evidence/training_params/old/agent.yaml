seed: 42
device: cuda:0
num_steps_per_env: 32
max_iterations: 400
empirical_normalization: false
policy:
  class_name: ActorCritic
  init_noise_std: 0.8
  noise_std_type: scalar
  actor_hidden_dims:
  - 256
  - 256
  - 128
  critic_hidden_dims:
  - 256
  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.003
  desired_kl: 0.008
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  symmetry_cfg: null
  rnd_cfg: null
clip_actions: 1.0
save_interval: 100
experiment_name: open_duck_v2_101_velocity
run_name: flat_corrected
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 2026-11-10_00-35-43_forward_curriculum
load_checkpoint: model_300.pt
